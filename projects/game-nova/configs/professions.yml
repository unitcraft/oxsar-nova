# Профессии игрока. effects — виртуальные уровни при расчёте
# производства и боя (положительные и отрицательные вместе, в порядке
# legacy `consts.php:$GLOBALS["PROFESSIONS"]` tech_special).
# Смена профессии: 1000 cr, мин. интервал 14 дней.
#
# План 72.1.59: тексты label/description вынесены в configs/i18n/
# {ru,en}.yml (ключи profession.<key>Label / <key>Desc).
# План 72.1.59 (повторно): bonus/malus → ordered effects, потому что
# legacy сохраняет порядок per-profession (у Атакера и Оборонщика
# разный порядок отображения). Go map [string]int random-iteration
# терял порядок; YAML-список его сохраняет.

professions:
  universal:
    sort_order: 0
    effects: []

  miner:
    sort_order: 1
    # 1:1 с legacy `consts.php:782-792` PROFESSION_MINER tech_special.
    effects:
      - { key: metalmine,      value:  1 }
      - { key: silicon_lab,    value:  1 }
      - { key: solar_plant,    value:  2 }
      - { key: shipyard,       value: -2 }
      - { key: gun,            value: -2 }
      - { key: shield_weapon,  value: -2 }
      - { key: shell_weapon,   value: -2 }
      - { key: ballistics,     value: -1 }
      - { key: computer_tech,  value: -1 }

  attacker:
    sort_order: 2
    # 1:1 с legacy `consts.php:794-808` PROFESSION_ATTACKER tech_special.
    effects:
      - { key: gun,             value:  1 }
      - { key: shield_weapon,   value:  1 }
      - { key: shell_weapon,    value:  1 }
      - { key: ballistics,      value:  1 }
      - { key: shipyard,        value:  1 }
      - { key: metalmine,       value: -1 }
      - { key: silicon_lab,     value: -1 }
      - { key: ign,             value: -1 }
      - { key: defense_factory, value: -3 }

  defender:
    sort_order: 3
    # 1:1 с legacy `consts.php:809-820` PROFESSION_DEFENDER tech_special.
    effects:
      - { key: masking,         value:  1 }
      - { key: shield_weapon,   value:  1 }
      - { key: shell_weapon,    value:  1 }
      - { key: defense_factory, value:  1 }
      - { key: rocket_station,  value:  1 }
      - { key: computer_tech,   value: -1 }
      - { key: gun,             value: -1 }
      - { key: shipyard,        value: -3 }

  tank:
    sort_order: 4
    # 1:1 с legacy `consts.php:822-833` PROFESSION_TANK tech_special.
    effects:
      - { key: gun,                value:  2 }
      - { key: shield_weapon,      value:  2 }
      - { key: shell_weapon,       value:  2 }
      - { key: gravi,              value: -2 }
      - { key: combustion_drive,   value: -2 }
      - { key: impulse_drive,      value: -2 }
      - { key: hyperspace_drive,   value: -2 }
