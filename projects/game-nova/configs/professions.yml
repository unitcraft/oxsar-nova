# Профессии игрока. bonus/malus — виртуальные уровни при расчёте производства и боя.
# Смена профессии: 1000 cr, мин. интервал 14 дней.
#
# План 72.1.59: тексты label/description перенесены в
# configs/i18n/{ru,en}.yml в группу `profession` (ключи `<key>Label` и
# `<key>Desc`). Балансовый YAML содержит только числовые параметры,
# как у buildings.yml/research.yml/ships.yml.
#
# План 72.1.58: добавлен Универсал (без бонусов) + sort_order для
# legacy-порядка (Универсал → Шахтер → Атакер → Оборонщик → Танкист).

professions:
  universal:
    sort_order: 0
    bonus: {}
    malus: {}

  miner:
    sort_order: 1
    bonus:
      metalmine: 1
      silicon_lab: 1
      solar_plant: 2
    malus:
      shipyard: -2
      gun: -2
      shield_weapon: -2
      shell_weapon: -2

  attacker:
    sort_order: 2
    bonus:
      gun: 1
      shield_weapon: 1
      shell_weapon: 1
      ballistics: 1
      shipyard: 1
    malus:
      metalmine: -1
      silicon_lab: -1
      defense_factory: -3

  defender:
    sort_order: 3
    bonus:
      masking: 1
      shield_weapon: 1
      shell_weapon: 1
      defense_factory: 1
      rocket_station: 1
    malus:
      computer_tech: -1
      gun: -1
      shipyard: -3

  tank:
    sort_order: 4
    bonus:
      gun: 2
      shield_weapon: 2
      shell_weapon: 2
    malus:
      gravi: -2
      combustion_drive: -2
      impulse_drive: -2
      hyperspace_drive: -2
